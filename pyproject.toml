[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whiz-label-forge"
version = "1.2.0"
description = "AI dataset preparation, multi-model YOLO auto-labeling, and training toolkit."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.23.5,<2",
    "Pillow>=10.0.0",
    "scipy>=1.10.0",
    "PyYAML>=6.0.0",
    "opencv-python>=4.8.0",
    "yt-dlp>=2024.10.22",
    "sv-ttk>=2.6.0",
    "onnxruntime>=1.18.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.18.0",
]
training = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[tool.setuptools]
py-modules = ["App", "LabelEditor", "Main", "NullGeneratorTab"]
